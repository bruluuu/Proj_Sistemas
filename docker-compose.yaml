services:
  db1:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_db_1
    volumes:
      - pgdata1:/var/lib/postgresql/data
    networks:
      - chat-net

  db2:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_db_2
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - chat-net

  proxy:
    build: ./proxy
    networks:
      - chat-net

  referencia:
    build: ./referencia
    ports:
      - "5557:5557"
    networks:
      - chat-net

  server1:
    build: ./server
    environment:
      - DB_HOST=db1
      - DB_NAME=chat_db_1
      - DB_USER=admin
      - DB_PASSWORD=password
    depends_on:
      - db1
      - proxy
      - referencia
    networks:
      - chat-net

  server2:
    build: ./server
    environment:
      - DB_HOST=db2
      - DB_NAME=chat_db_2
      - DB_USER=admin
      - DB_PASSWORD=password
    depends_on:
      - db2
      - proxy
      - referencia
    networks:
      - chat-net

  client1:
    build: ./client
    environment:
      - TARGET_HOST=server1
      - CLIENT_NAME=Client1
    depends_on:
      - server1
      - proxy
    networks:
      - chat-net

  client2:
    build: ./client
    environment:
      - TARGET_HOST=server2
      - CLIENT_NAME=Client2
    depends_on:
      - server2
      - proxy
    networks:
      - chat-net

volumes:
  pgdata1:
  pgdata2:

networks:
  chat-net:
    driver: bridge