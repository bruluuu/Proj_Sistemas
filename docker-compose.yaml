networks:
  chat-net:
    driver: bridge

volumes:
  pgdata1:
  pgdata2:
  pgdata3:

services:
  db1:
    image: postgres:15-alpine
    container_name: db1
    environment:
      POSTGRES_DB: chat_db_1
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata1:/var/lib/postgresql/data
    networks:
      - chat-net

  db2:
    image: postgres:15-alpine
    container_name: db2
    environment:
      POSTGRES_DB: chat_db_2
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - chat-net

  db3:
    image: postgres:15-alpine
    container_name: db3
    environment:
      POSTGRES_DB: chat_db_3
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata3:/var/lib/postgresql/data
    networks:
      - chat-net

  referencia:
    build: ./referencia
    container_name: referencia
    networks:
      - chat-net

  proxy:
    build: ./proxy
    container_name: proxy
    ports:
      - "5555:5555"
    networks:
      - chat-net

  server1:
    build: ./server
    container_name: server1
    environment:
      - SERVER_NAME=server1
      - DB_HOST=db1
      - DB_NAME=chat_db_1
      - DB_USER=admin
      - DB_PASSWORD=password
    depends_on:
      - db1
      - referencia
      - proxy
    networks:
      - chat-net

  server2:
    build: ./server
    container_name: server2
    environment:
      - SERVER_NAME=server2
      - DB_HOST=db2
      - DB_NAME=chat_db_2
      - DB_USER=admin
      - DB_PASSWORD=password
    depends_on:
      - db2
      - referencia
      - proxy
    networks:
      - chat-net

  server3:
    build: ./server
    container_name: server3
    environment:
      - SERVER_NAME=server3
      - DB_HOST=db3
      - DB_NAME=chat_db_3
      - DB_USER=admin
      - DB_PASSWORD=password
    depends_on:
      - db3
      - referencia
      - proxy
    networks:
      - chat-net

  client1:
    build: ./client
    environment:
      - SERVER_HOST=proxy
      - CLIENT_NAME=Client1
    depends_on:
      - proxy
      - server1
    networks:
      - chat-net

  client2:
    build: ./client
    environment:
      - SERVER_HOST=proxy
      - CLIENT_NAME=Client2
    depends_on:
      - proxy
      - server2
    networks:
      - chat-net